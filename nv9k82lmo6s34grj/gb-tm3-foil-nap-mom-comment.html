        + media(p+".media","Add video")
        + field(p+".note","What to take from it",{rows:2,ph:"Which part matters: the hook, the pacing, the captions…"})

  /* Headline preview: the text in a frame at the ad's real shape, line breaks exactly as typed,
     each line kept on one line and the whole block scaled to fit the safe area. */
  function ratio(b){
    var order = [["9x16","9/16","9:16"],["4x5","4/5","4:5"],["1x1","1/1","1:1"],["16x9","16/9","16:9"]];
    for (var i = 0; i < order.length; i++) if ((b.sizes||[]).indexOf(order[i][0]) > -1) return order[i];
    return order[0];
  }
  function frame(text, forPath){
    var r = ratio(B()), t = String(text || "").replace(/\s+$/,"").replace(/^\s*\n/,"");
    return '<div class="frame" style="--ar:'+r[1]+'"><span class="frame-text"'+(forPath ? ' data-for="'+forPath+'"' : '')+'>'+esc(t)+'</span></div>'
      + '<div class="frame-cap">'+r[2]+' preview'+(forPath ? ' · updates as you type' : '')+'</div>';
  }
  function fitFrames(){
    // Line the frames up across hooks: every Visuals block in a row gets the tallest one's height.
    app.querySelectorAll(".row").forEach(function(row){
      var hv = row.querySelectorAll(".hv"), max = 0;
      hv.forEach(function(x){ x.style.minHeight = ""; max = Math.max(max, x.offsetHeight); });
      hv.forEach(function(x){ x.style.minHeight = max + "px"; });
    });
    app.querySelectorAll(".frame-text").forEach(function(t){
      var box = t.parentNode, w = box.clientWidth * 0.8, h = box.clientHeight * 0.8;
      if (!w) return;
      var size = Math.min(w * 0.095, 42);
      t.style.fontSize = size + "px";
      var k = Math.min(1, w / (t.offsetWidth || 1), h / (t.offsetHeight || 1));
      if (k < 1) t.style.fontSize = Math.max(7, Math.floor(size * k * 10) / 10) + "px";
    });
  }
  var fitTimer = null;
  window.addEventListener("resize", function(){ clearTimeout(fitTimer); fitTimer = setTimeout(fitFrames, 80); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitFrames(); });

  function render(){
    if (!briefs.length && !draft){
      app.innerHTML = top() + '<div class="loading">No briefs yet. Click <b>New brief</b> to start one.</div>';
      return;
    }
    var b = B(), upd = b.updated ? new Date(b.updated) : null;
    app.innerHTML = top() + titleBlock() + memoBlock() + '<div class="board">'+zoneBrief()+zoneStructure()+zoneEdit()+'</div>'
      + '<footer class="foot"><span>'+(upd && !isNaN(upd) ? 'Updated '+upd.toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : '')+'</span>'
      + '<span>'+(READONLY ? 'Questions about the brief? Message whoever sent it.' : esc(briefs.length+' '+(briefs.length===1?'brief':'briefs')+' saved in shared/creative-briefs/briefs'))+'</span></footer>';
    app.querySelectorAll("textarea.in").forEach(grow);
    fitFrames();
  }
  function grow(t){ t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }
  function say(text,kind){ msg = {text:text||"", kind:kind||""}; render(); }

  /* ---------- server calls ---------- */
  function api(method, url, body, headers){
    return fetch(url, {method:method, body:body, headers:headers || (body ? {"Content-Type":"application/json"} : undefined)})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) throw new Error(j.error || ("Error " + r.status)); return j; }); });
  }
  function goTo(i){
    cur = Math.max(0, Math.min(i, briefs.length-1)); armDelete = false;
    try { history.replaceState(null, "", "#" + briefs[cur].id); } catch(e){}
    msg = {text:"",kind:""}; render(); window.scrollTo(0,0);
  }

  /* ---------- events ---------- */
  app.addEventListener("input", function(e){
    var t = e.target, p = t.getAttribute && t.getAttribute("data-path"); if (!p || !draft) return;
    setPath(draft, p, t.value);
    var pv = app.querySelector('.frame-text[data-for="'+p+'"]');
    if (pv){ pv.textContent = t.value.replace(/\s+$/,"").replace(/^\s*\n/,""); fitFrames(); }
    if (t.tagName === "TEXTAREA") grow(t);
  });
  app.addEventListener("toggle", function(e){ if (e.target.classList && e.target.classList.contains("memo")) memoOpen = e.target.open; }, true);
  app.addEventListener("change", function(e){
    var t = e.target;
    if (t.id === "pick"){ goTo(Number(t.value)); return; }
    if (t.getAttribute && t.getAttribute("data-rerender")) render();
  });
  app.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]"); if (!el || busy) return;
    var act = el.getAttribute("data-act"), p = el.getAttribute("data-path"), v = el.getAttribute("data-v");
    if (act === "dplay"){ var fr = document.createElement("iframe"); fr.className = "dv-frame"; fr.allow = "autoplay; fullscreen"; fr.src = "https://drive.google.com/file/d/"+el.getAttribute("data-id")+"/preview"; el.replaceWith(fr); return; }
    if (act === "copyscript"){ copyText(el.getAttribute("data-text") || "").then(function(){ el.textContent = "Copied"; setTimeout(function(){ el.textContent = "Copy script"; }, 1500); }); return; }
    if (act !== "delete") armDelete = false;
    if (act === "edit"){ draft = clone(briefs[cur]); isNew = false; msg = {text:"",kind:""}; render(); return; }
    if (act === "new"){ draft = blankBrief(); isNew = true; msg = {text:"",kind:""}; render(); window.scrollTo(0,0); return; }
    if (act === "copylink"){ copyText(B().siteLink).then(function(){ say("Copied: " + B().siteLink, "good"); }); return; }
    if (act === "dup"){ draft = clone(briefs[cur]); delete draft.siteLink; draft.id = newId(); draft.title = (draft.title || "Untitled") + " (copy)"; draft.status = "Draft"; delete draft.updated; isNew = true; msg = {text:"",kind:""}; render(); window.scrollTo(0,0); return; }
    if (act === "cancel"){ draft = null; isNew = false; msg = {text:"",kind:""}; render(); return; }
    if (act === "save"){
      busy = true; render();
      api("PUT", "/api/briefs/" + encodeURIComponent(draft.id), JSON.stringify(draft)).then(function(saved){
        normalize(saved);
        var i = briefs.findIndex(function(b){ return b.id === saved.id; });
        if (i > -1) briefs[i] = saved; else { briefs.unshift(saved); i = 0; }
        draft = null; isNew = false; busy = false; cur = i;
        try { history.replaceState(null, "", "#" + saved.id); } catch(e){}
        say("Saved.", "good");
      }).catch(function(err){ busy = false; say("Couldn't save: " + err.message + ". Is the briefs server still running?", "err"); });
      return;
    }
    if (act === "delete"){
      if (!armDelete){ armDelete = true; render(); return; }
      armDelete = false; busy = true; render();
      api("DELETE", "/api/briefs/" + encodeURIComponent(draft.id)).then(function(){
        briefs.splice(cur,1); draft = null; busy = false; cur = 0;
        say("Brief deleted. A copy is kept in briefs/.deleted.", "good");
      }).catch(function(err){ busy = false; say("Couldn't delete: " + err.message, "err"); });
      return;
    }
    if (act === "share"){
      busy = true; render();
      api("POST", "/api/export/" + encodeURIComponent(briefs[cur].id)).then(function(r){
        busy = false;
        var note = r.embedded && r.embedded.length ? " " + r.embedded.length + " clip(s) aren't in the Drive folder yet, so they're packed inside the file: " + r.embedded.join(", ") + "." : "";
        if (r.link){ briefs[cur].siteLink = r.link; render(); copyText(r.link); say("Brief link (copied, live in about a minute): " + r.link + " · Same link every time you re-share this brief. Paste it in the growth guide's LINK TO BRIEF.", "good"); }
        else say("Saved " + r.file + " (" + r.mb + " MB) in " + r.folder + ". " + (r.linked ? r.linked + " clips play from Google Drive. " : "") + "Send that file to the editor; it opens in any browser, read-only." + note, note ? "err" : "good");
      }).catch(function(err){ busy = false; say("Couldn't build the file: " + err.message, "err"); });
      return;
    }
    if (act === "type"){ draft.adType = v; render(); return; }
    if (act === "size"){ var s = draft.sizes, k = s.indexOf(v); if (k > -1) s.splice(k,1); else s.push(v); render(); return; }
    if (act === "add"){
      var blank = {hooks:{visual:"",onScreen:"",vo:"",notes:"",media:[]}, holds:{script:"",onScreen:"",visual:"",notes:"",media:[]},
        references:{tag:"inspiration",title:"",note:"",media:[]}, voiceover:{name:"",voice:"",note:"",media:[]}, sections:{title:"",body:"",media:[]}}[v];
      draft[v].push(blank); render(); return;
    }
    if (act === "addbeat"){ var hp = p.split(".").slice(0,2).join("."), h = getPath(draft, hp); h.beats = h.beats || []; h.beats.push({text:"",vo:"",visual:"",shoot:"library",media:[]}); render(); return; }
    if (act === "del"){ var ks = p.split("."), idx = Number(ks.pop()); getPath(draft, ks.join(".")).splice(idx,1); render(); return; }
    if (act === "link"){ getPath(draft,p).push({kind:"link",url:"",name:""}); render(); var ins = app.querySelectorAll('[data-path^="'+p+'."][data-path$=".url"]'); if (ins.length) ins[ins.length-1].focus(); return; }
    if (act === "file"){ fileTarget = p; fileInput.value = ""; fileInput.click(); return; }
  });
  fileInput.addEventListener("change", function(){
    var files = Array.prototype.slice.call(fileInput.files || []); if (!files.length || !fileTarget || !draft) return;
    var target = fileTarget, errs = [];
    busy = true; say("Uploading " + plural(files.length,"file") + "…");
    files.reduce(function(chain, f){
      return chain.then(function(){
        var ext = (f.name.split(".").pop() || "").toLowerCase();
        var kind = /^(mp4|mov|webm)$/.test(ext) ? "video" : /^(mp3|wav|m4a)$/.test(ext) ? "audio" : /^(png|jpe?g|webp|gif)$/.test(ext) ? "image" : "file";
        return api("POST", "/api/media?name=" + encodeURIComponent(f.name), f, {"Content-Type":"application/octet-stream"})
          .then(function(r){ getPath(draft,target).push({kind:kind, name:f.name, src:r.src}); })
          .catch(function(err){ errs.push(err.message); });
      });
    }, Promise.resolve()).then(function(){
      busy = false;
      say(errs.length ? errs.join(" ") : "Uploaded. Save the brief to keep it.", errs.length ? "err" : "");
    });
  });

  /* ---------- start ---------- */
  if (READONLY){
    try { briefs = [normalize(JSON.parse(exportText))]; } catch(e){ app.innerHTML = '<p class="loading">This brief file is damaged. Ask for a new copy.</p>'; return; }
    render();
  } else if (location.protocol === "file:"){
    app.innerHTML = '<p class="loading">Open the briefs app with <b>Open Briefs.command</b> (double-click it in shared/creative-briefs).</p>';
  } else {
    api("GET", "/api/briefs").then(function(list){
      briefs = list.map(normalize);
      // Fixed order (a brief's "order" number) first, then newest; the server sorts too, this guards a stale server.
      briefs = briefs.map(function(b,i){ return [b,i]; }).sort(function(x,y){
        var a = typeof x[0].order === "number", c = typeof y[0].order === "number";
        if (a && c) return x[0].order - y[0].order;
        if (a !== c) return a ? -1 : 1;
        return x[1] - y[1];
      }).map(function(p){ return p[0]; });
      var h = (location.hash || "").replace(/^#/,""), i = briefs.findIndex(function(b){ return b.id === h; });
      cur = i > -1 ? i : 0;
      render();
    }).catch(function(err){ app.innerHTML = '<p class="loading">Couldn\'t load briefs: ' + esc(err.message) + '</p>'; });
  }
})();
</script>
</body>
